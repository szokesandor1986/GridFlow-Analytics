name: Adatfrissítés és közzététel

# Az ENTSO-E adatai óránként frissülnek, ezért 20 percenként futtatni bőven elég.
# A GitHub az ütemezett futásokat késleltetheti; ez normális.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Egyszerre csak egy közzététel fusson; a félbehagyott futást nem szakítjuk meg.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Függőségek
        run: pip install -r requirements.txt

      - name: Gyűjtő tesztje (kitalált klienssel, hálózat nélkül)
        run: python -I tests/test_collector.py

      - name: Adatgyűjtés az ENTSO-E-ről
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: |
          mkdir -p dist
          python collector.py --out dist/data.json
          cp index.html muszaki.html europa.html gaz.html demo-data.json demo-engineer.json demo-europe.json demo-history.json demo-gas.json dist/
          cp history.json gas.json dist/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
