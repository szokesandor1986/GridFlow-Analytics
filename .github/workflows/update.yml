name: Adatfrissítés és közzététel

# Az ENTSO-E adatai óránként frissülnek, ezért 20 percenként futtatni bőven elég.
# A GitHub az ütemezett futásokat késleltetheti; ez normális.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Egyszerre csak egy közzététel fusson; a félbehagyott futást nem szakítjuk meg.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Függőségek
        run: pip install -r requirements.txt

      - name: Gyűjtő tesztje (kitalált klienssel, hálózat nélkül)
        run: |
          python -I tests/test_collector.py
          python -I tests/test_freq.py
          python -I tests/test_hupx.py

      # A gáz- és a hosszú távú adat a "data" ágon él (a gyűjtő workflow-k oda mentenek); ha még nincs, a main példánya marad.
      - name: Tárolt adatok betöltése (data ág)
        run: bash scripts/load_data.sh history.json gas.json

      - name: Adatgyűjtés az ENTSO-E-ről
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: |
          mkdir -p dist
          python collector.py --out dist/data.json
          cp index.html muszaki.html europa.html foldgaz.html europe-geo.json demo-data.json demo-engineer.json demo-europe.json demo-countries.json demo-history.json demo-gas.json demo-frequency.json demo-hupx.json dist/
          cp history.json gas.json dist/ 2>/dev/null || true

      # Hálózati frekvencia (Energy-Charts, kulcs nélkül). Az előző állapotot (napi összesítések) az élő oldalról
      # töltjük le, így nem kell a repóba commitolni. Hiba esetén a közzététel akkor is megtörténik.
      - name: Frekvencia (Energy-Charts)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          mkdir -p dist
          curl -fsS --max-time 30 "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/frequency.json" -o dist/frequency.json || rm -f dist/frequency.json
          python freq.py --out dist/frequency.json --max-fetch 3

      # REMIT-kiesések a HUPX Inside Information Platformról (kulcs: HUPX_KEY secret). Kulcs vagy hiba esetén a
      # kártya egyszerűen nem jelenik meg, a közzététel megtörténik.
      - name: HUPX kiesések (REMIT)
        continue-on-error: true
        timeout-minutes: 5
        env:
          HUPX_KEY: ${{ secrets.HUPX_KEY }}
        run: python hupx.py --out dist/hupx.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
