name: Gáz adatok

# Földgáz-tározók (GIE AGSI+) és magyar határpontok (ENTSOG) a "Gáztározók" oldalhoz (gas.json).
# Naponta kétszer fut (az AGSI+ adatai este ~19:30 CET körül jelennek meg, a második kör a korrekciókat hozza),
# és kézzel is indítható: Actions -> Gáz adatok -> Run workflow.
# Az eredmény a repó gyökerébe kerül (gas.json), a következő 20 perces futás teszi közzé.
on:
  schedule:
    - cron: "50 18 * * *"
    - cron: "35 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gas
  cancel-in-progress: false

jobs:
  gas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Függőségek
        run: pip install -r requirements.txt

      - name: Teszt (kitalált klienssel, hálózat nélkül)
        run: python -I tests/test_gas.py

      - name: Adatgyűjtés (AGSI+ és ENTSOG)
        env:
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
        run: python gas.py --out gas.json

      - name: Mentés a repóba
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gas.json
          if git diff --cached --quiet; then
            echo "Nincs változás."
          else
            git commit -m "gas.json frissítése"
            git push
          fi
